name: Build Check

on:
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Build
              run: npm run build

            - name: Get build size
              run: |
                  CURRENT_SIZE=$(du -sh dist | cut -f1)
                  echo "::set-output name=size::$CURRENT_SIZE"
