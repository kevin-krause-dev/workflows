name: Test Suite

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm run test:coverage

            - name: Check if tests passed
              run: |
                  if [ $? -ne 0 ]; then
                    echo "Tests failed"
                    exit 1
                  fi
                  echo "Tests passed"
