name: Test Suite

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm run test:coverage -- --coverageReporters="json-summary"

            - name: Check coverage threshold
              run: |
                  COVERAGE=$(jq -r '.total.statements.pct' coverage/coverage-final.json)
                  if (( $(echo "$COVERAGE < 80" | bc -l) )); then
                    echo "Code coverage is below 80% (Current: $COVERAGE%)"
                    exit 1
                  fi
                  echo "Code coverage is at $COVERAGE%"
