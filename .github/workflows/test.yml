name: Test Suite

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - name: Setup Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm run test:coverage

            - name: Check coverage threshold
              run: |
                  TOTAL_LINES=$(grep -A 4 "All files" coverage/lcov-report/index.html | grep "Lines" | sed 's/.*>\([0-9.]*\)%.*/\1/')
                  echo "Current coverage: $TOTAL_LINES%"
                  if (( $(echo "$TOTAL_LINES < 80" | bc -l) )); then
                    echo "Code coverage is below 80%"
                    exit 1
                  fi
                  echo "Coverage check passed"
